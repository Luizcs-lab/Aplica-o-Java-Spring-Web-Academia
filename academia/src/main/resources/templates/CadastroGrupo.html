<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css" />
</head>

<body>
    <!--script para funcionamento do bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestão de Academia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/index}">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroAparelho}">Aparelhos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Cadastroalunos}">Alunos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Instrutores}">Instrutores</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroExercicio}">Exercicios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroGrupo}">Grupo</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/LoginUsuario}">Usuario</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <!--fim da barra de navegação do sistema -->
    <div class="container mt-4 mt-5">

        <section>

            <h1>Cadastro de Grupos:</h1>

            <form th:action="@{/Grupo}" th:object="${grupo}" method="post">

                <div class="mb-3">
                    <label class="form-label">Instrutor:</label>
                    <input type="text" class="form-control" required placeholder="Instrutor do grupo"
                        th:field="*{instrutor}">

                </div>

                <div class="mb-3">
                    <label class="form-label">código:</label>
                    <input type="text" class="form-control" required placeholder="código do grupo" th:field="*{codigo}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição:</label>
                    <input type="text" class="form-control" required placeholder="descrição do grupo"
                        th:field="*{descricao}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Situação:</label>
                    <input type="text" class="form-control" required placeholder="Situação do grupo"
                        th:field="*{situacao}">

                </div>

                <div class="mb-3">
                    <label class="form-label">Observação:</label>
                    <input type="text" class="form-control" required placeholder="Observação sobre o grupo"
                        th:field="*{obs}">

                </div>
                <div class="mb-3">
                    <label class="form-label">Data:</label>
                    <input type="text" required placeholder="Data do grupo" th:field="*{data}">

                </div>
                <button type="submit" class=" btn btn-primary w-100">Cadastrar grupo</button>
            </form>
        </section>
    </div>

    <footer>
        <p>Desenvolvido por: <a href="https://github.com/Luizcs-lab">Cesar Luiz da Silva</a></p>
    </footer>


</body>

</html>
