<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <!--script para funcionamento do bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestão de Academia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/index}">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroAparelho}">Aparelhos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Cadastroalunos}">Alunos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Instrutores}">Instrutores</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroExercicio}">Exercicios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroGrupo}">Grupo</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/LoginUsuario}">Usuario</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <form th:action="@{/Login/autenticar}" th:object="${login}" method="post">
        <div class="mb-3">
            <label class="form-label">Nome de usuário:</label>
            <input type="text" required placeholder="Nome de usuário" th:field="*{nomeUsuario}">
        </div>

        <div class="mb-3">
            <label class="form-label">Senha:</label>
            <input type="password" required placeholder="Senha" th:field="*{senha}">
        </div>

        <button type="submit" class=" btn btn-primary w-100">Entrar</button>
    </form>

    <footer>
        <p>Desenvolvido por: <a href="https://github.com/Luizcs-lab">Cesar Luiz da Silva</a></p>
    </footer>

</body>

</html>
