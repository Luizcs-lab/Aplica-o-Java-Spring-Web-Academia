<!doctype html>
<html lang="pt-br" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css" />
</head>

<body>
    <!--script para funcionamento do bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gestão de Academia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/index}">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroAparelho}">Aparelhos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Cadastroalunos}">Alunos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Instrutores}">Instrutores</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroExercicio}">Exercicios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/CadastroGrupo}">Grupo</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/LoginUsuario}">Usuario</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <!--fim da barra de navegação do sistema -->
    <div class="container mt-4 mb-5">

        <section>
            <h1>Academia</h1>
            <p>Controle dos instrutores responsáveis.</p>

            <table class="table table-striped table-hover mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome do instrutor</th>
                        <th>telefone</th>
                        <th>email</th>

                    </tr>
                </thead>
                <tbody>
                    <!--exibir os dados do instrutor    -->
                    <tr th:each="Instrutor : ${listaInstrutores}">
                        <th th:text="${Instrutor.id}">1</th>
                        <td th:text="${Instrutor.nome}"></td>
                        <td th:text="${Instrutor.telefone}"></td>
                        <td th:text="${Instrutor.email}"></td>

                        <a th:href="@{/Instrutores/editarInstrutor/{id}(id=${Instrutor.id})}"
                            class="btn btn-primary">Editar</a>
                        <a th:href="@{/Instrutores/excluirInstrutor/{id}(id=${Instrutor.id})}"
                            class="btn btn-danger">Excluir</a>


                    </tr>
                    <tr th:if="${#lists.isEmpty(listaInstrutores)}">
                        <td colspan="4" class="text-center text-muted">Nenhum instrutor cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>

        </section>
    </div>


    <footer>
        <p>Desenvolvido por: <a href="https://github.com/Luizcs-lab">Cesar Luiz da Silva</a></p>
    </footer>


</body>

</html>
