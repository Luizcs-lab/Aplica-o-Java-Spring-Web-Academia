<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Gestão de Academia</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" th:href="@{/Pessoa/Cadastroalunos}">Alunos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4 mb-5">
        <h1>Cadastro de Pessoa</h1>

        <!-- Alertas de Sucesso ou Erro enviados pelo Controller -->
        <div th:if="${mensagem}" class="alert alert-success" role="alert" th:text="${mensagem}"></div>
        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

        <form th:action="@{/Pessoa}" th:object="${pessoa}" method="post">
            
            <div class="mb-3">
                <label class="form-label">Tipo:</label>
                <select class="form-select" th:field="*{tipo}" required>
                    <option value="" disabled selected>Selecione o tipo...</option>
                    <option value="A">Aluno</option>
                    <option value="I">Instrutor</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Nome Completo:</label>
                <input type="text" class="form-control" th:field="*{nome}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Data de Nascimento:</label>
                <input type="date" class="form-control" th:field="*{dataNascimento}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">CPF (Apenas números - 11 dígitos):</label>
                <input type="text" class="form-control" th:field="*{cpf}" maxlength="11" placeholder="Ex: 12345678901" required>
            </div>

            <div class="mb-3">
                <label class="form-label">RG (Apenas números):</label>
                <input type="text" class="form-control" th:field="*{rg}" maxlength="15" required>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail:</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Telefone:</label>
                <input type="text" class="form-control" th:field="*{telefone}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">CEP:</label>
                <input type="text" class="form-control" th:field="*{cep}" required>
            </div>

            <div class="row">
                <div class="col-md-9 mb-3">
                    <label class="form-label">Endereço:</label>
                    <input type="text" class="form-control" th:field="*{endereco}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Número:</label>
                    <input type="text" class="form-control" th:field="*{numero}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-5 mb-3">
                    <label class="form-label">Bairro:</label>
                    <input type="text" class="form-control" th:field="*{bairro}" required>
                </div>
                <div class="col-md-5 mb-3">
                    <label class="form-label">Cidade:</label>
                    <input type="text" class="form-control" th:field="*{cidade}" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">UF:</label>
                    <input type="text" class="form-control" th:field="*{estado}" maxlength="2" placeholder="SP" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Observação:</label>
                <input type="text" class="form-control" th:field="*{observacao}">
            </div>

            <div class="mb-3">
                <label class="form-label">Data de Admissão:</label>
                <input type="date" class="form-control" th:field="*{dataAdmissao}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Cadastrar Pessoa</button>
        </form>
    </div>
</body>
</html>
