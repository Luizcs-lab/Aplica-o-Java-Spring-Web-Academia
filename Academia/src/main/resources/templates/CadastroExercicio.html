<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Exercicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
      
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
    <!--script para funcionamento do bootstrap-->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
      crossorigin="anonymous"></script>


    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Gestão de Academia</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">

            <li class="nav-item">
              <a class="nav-link active" aria-current="page" th:href="@{/index}">Inicio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" th:href="@{/CadastroAparelho}" >Aparelhos</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" th:href="@{/Cadastroalunos}" >Alunos</a>
            </li>

             <li class="nav-item">
              <a class="nav-link" href="/">Instrutores</a>
            </li>

             <li class="nav-item">
              <a class="nav-link" th:href="@{/CadastroExercicio}">Exercicios</a>
            </li>

             <li class="nav-item">
              <a class="nav-link" href="#">Grupo</a>
            </li>

             <li class="nav-item">
              <a class="nav-link" href="#">Usuario</a>
            </li>


            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>

          </ul>
        </div>
      </div>
    </nav>


    <h1>Cadastro de Exercicios:</h1>
    
    <form th:action="@{/Exercicio/salvar}" th:object="${exercicio}" method="post">
      <div class="mb-3">
      <label class="form-label">Código do Exercicio:</label>
      <input type="text" required placeholder="código do exercicio" th:field="*{codExercicio}">
      </div>
      
      <div class="mb-3">
      <label class="form-label">Nome do exercicio:</label>
      <input type="text" required placeholder="nome do exercicio" th:field="*{nmExercicio}">      
      </div>

        <div class="mb-3">
      <label class="form-label">Observação:</label>
      <input type="text" required placeholder="Observação sobre" th:field="*{obs}">
      
      </div>

     <div class="mb-3">
  <label class="form-label">Aparelho destinado:</label>
  <!-- Aponta diretamente para o ID do objeto encadeado -->
  <select class="form-select" th:field="*{aparelho.id}">
    <option value="" th:if="${#lists.isEmpty(listaAparelhos)}">
      Nenhum aparelho cadastrado no sistema
    </option>
    <option value="" th:if="${!#lists.isEmpty(listaAparelhos)}">Selecione o aparelho:</option>
    <option th:each="a : ${listaAparelhos}"
            th:value="${a.id}"
            th:text="${a.nomeAparelho}"> <!-- Usa o nome do atributo Java (camelCase) -->
    </option>
  </select>
</div>


      <button type="submit" class=" btn btn-primary w-100">Cadastrar exercicio</button>
    </form>
    
<table class="table table-striped table-hover mt-3">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Codigo do exercicio</th>
                <th>Nome do Exercício</th>
               
            </tr>
        </thead>
        <tbody>
            <tr th:each="exe : ${listaExercicios}">
                <th th:text="${exe.id}">1</th>
                <th th:text="${exe.cod_Exercicio}"></th>
                <td th:text="${exe.nmExercicio}"></td>
                
            </tr>
            <tr th:if="${#lists.isEmpty(listaExercicios)}">
                <td colspan="3" class="text-center text-muted">Nenhum exercício cadastrado ainda.</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
